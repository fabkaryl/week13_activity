<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 13 Activity | Bootstrap Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Override Bootstrap primary color with CSS variable -->
    <style>
        :root {
            --bs-primary: #6f42c1;
        }
        .btn-primary {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
        }
        .btn-primary:hover {
            background-color: #5a32a3;
        }
    </style>
</head>
<body>

<!-- Part A: Responsive Navbar (brand, nav links, hamburger toggle) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">MyMusic</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Part A: Bootstrap Card -->
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card">
                <div class="card-header">
                    Dashboard
                </div>
                <div class="card-body">
                    <h5 class="card-title">Welcome</h5>
                    <p class="card-text">Click the button to open the contact form.</p>
                    <!-- Button that opens Modal -->
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#contactModal">
                        Open Contact Form
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Part A: Modal (header, body, Close & Submit buttons) -->
<div class="modal fade" id="contactModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Contact Us</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Part B: Form with needs-validation + novalidate -->
                <form id="contactForm" class="needs-validation" novalidate>
                    <!-- Name (required) -->
                    <div class="mb-3">
                        <label class="form-label">Name *</label>
                        <input type="text" class="form-control" id="name" required>
                        <div class="invalid-feedback">Please enter your name.</div>
                    </div>
                    <!-- Email (type=email) -->
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control" id="email" required>
                        <div class="invalid-feedback">Enter a valid email.</div>
                    </div>
                    <!-- Message (min 20 chars) -->
                    <div class="mb-3">
                        <label class="form-label">Message * (min 20 chars)</label>
                        <textarea class="form-control" id="message" rows="2" required></textarea>
                        <div class="invalid-feedback">Message must be at least 20 characters.</div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<!-- Part B: Validation JS -->
<script>
    const form = document.getElementById('contactForm');
    
    form.addEventListener('submit', function(event) {
        const message = document.getElementById('message');
        if (message.value.length < 20) {
            message.setCustomValidity('Too short');
        } else {
            message.setCustomValidity('');
        }

        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        } else {
            event.preventDefault();
            alert('Form submitted!');
            bootstrap.Modal.getInstance(document.getElementById('contactModal')).hide();
            form.reset();
            form.classList.remove('was-validated');
        }
        form.classList.add('was-validated');
    });
</script>
</body>
</html>
